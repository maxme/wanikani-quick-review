name: Deploy GitHub Pages

on:
  push:
    # Only main: the github-pages environment only allows deployments from the default branch.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only the files the site uses (not the README, scripts or workflows).
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html app.js styles.css favicon.svg apple-touch-icon.png data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
