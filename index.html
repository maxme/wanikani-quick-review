<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Quick review list for WaniKani radicals, kanji and vocabulary, with meanings and readings hidden until you click.">
  <title>WaniKani Quick Review</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first render to avoid a light/dark flash
    try {
      var savedTheme = localStorage.getItem('wk-quick-review.theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (e) { /* storage unavailable: automatic theme */ }
  </script>
</head>
<body>
  <header class="topbar">
    <h1>WaniKani Quick Review</h1>
    <div class="topbar-actions">
      <button id="theme" class="ghost" type="button" aria-label="Change theme">Theme: auto</button>
      <button id="logout" class="ghost" type="button" hidden>Change token</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Login: enter the API token -->
    <section id="login" class="panel" hidden>
      <h2>Sign in</h2>
      <p>
        Enter your WaniKani API token. A read-only token is enough.
        It stays in this browser (localStorage) and is only sent to <code>api.wanikani.com</code>.
      </p>
      <form id="login-form" class="stack">
        <label for="token">API token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" required>
        <button type="submit" class="primary">Save and continue</button>
      </form>
      <p class="hint">
        Create a token at
        <a href="https://www.wanikani.com/settings/personal_access_tokens" target="_blank" rel="noopener">wanikani.com → Settings → API Tokens</a>.
      </p>
    </section>

    <!-- Filters -->
    <section id="filters" class="panel" hidden>
      <form id="filters-form" class="filters">
        <fieldset class="types">
          <legend>Types</legend>
          <label class="chip type-radical"><input type="checkbox" name="types" value="radical" checked> Radicals</label>
          <label class="chip type-kanji"><input type="checkbox" name="types" value="kanji" checked> Kanji</label>
          <label class="chip type-vocabulary"><input type="checkbox" name="types" value="vocabulary" checked> Vocabulary</label>
        </fieldset>

        <div class="row">
          <label>Min level
            <select id="level-min"></select>
          </label>
          <label>Max level
            <select id="level-max"></select>
          </label>
        </div>

        <label>Progress
          <select id="progress">
            <option value="all">All items</option>
            <option value="not-started">Not started yet</option>
            <option value="started">Started (in SRS)</option>
            <option value="review">Reviews available now</option>
            <option value="burned">Burned</option>
          </select>
        </label>

        <label>Mistakes
          <select id="mistakes">
            <option value="any">Any</option>
            <option value="since-last-visit">Missed since my previous visit</option>
            <option value="leech">Leeches (3+ misses, under 85% correct)</option>
            <option value="never">Never missed</option>
          </select>
          <small class="hint">WaniKani no longer exposes the time of each answer. A miss is detected when the list loads, by comparing with your previous visit, so the first visit has no baseline.</small>
        </label>

        <label class="check">
          <input id="autoplay" type="checkbox" checked>
          Autoplay vocabulary audio when revealed
        </label>

        <button type="submit" class="primary">Load list</button>
      </form>
    </section>

    <!-- Results -->
    <section id="results" hidden>
      <div class="toolbar">
        <span id="count" aria-live="polite"></span>
        <div class="actions">
          <button id="shuffle" type="button">Shuffle</button>
          <button id="show-all" type="button">Show all</button>
          <button id="hide-all" type="button">Hide all</button>
        </div>
      </div>
      <ol id="list" class="list"></ol>
      <nav id="pager" class="pager" aria-label="Pages" hidden>
        <button id="prev-page" type="button">← Previous</button>
        <span id="page-label"></span>
        <button id="next-page" type="button">Next →</button>
      </nav>
    </section>

    <p id="message" class="status" role="status" aria-live="polite"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
